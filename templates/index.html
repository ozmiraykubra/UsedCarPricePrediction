<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USED CAR PRICE ESTIMATE</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle, #2d0b5a 0%, #0f0f0f 100%); /* Derin mor ve siyah geçiş */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: rgba(25, 25, 25, 0.95); /* Koyu gri şeffaf panel */
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 15px rgba(138, 43, 226, 0.3);
            width: 550px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        h1 {
            text-align: center;
            font-size: 26px;
            letter-spacing: 3px;
            margin-bottom: 35px;
            color: #ffffff;
            text-transform: uppercase;
            font-weight: 800;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }
        label {
            font-size: 12px;
            color: #a0a0a0;
            margin-bottom: 8px;
            display: block;
            text-transform: uppercase;
        }
        input, select {
            width: 100%;
            padding: 14px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 10px;
            color: white;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }
        input:focus, select:focus {
            border-color: #9d50bb; /* Mor odak rengi */
            outline: none;
            box-shadow: 0 0 8px rgba(157, 80, 187, 0.4);
        }
        .full-width {
            grid-column: span 2;
        }
        button {
            grid-column: span 2;
            margin-top: 25px;
            padding: 18px;
            /* İstediğin mor tonunda degrade buton */
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: white;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.2s, box-shadow 0.3s;
            box-shadow: 0 10px 20px rgba(106, 17, 203, 0.3);
        }
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(106, 17, 203, 0.5);
            filter: brightness(1.1);
        }
        #result {
            margin-top: 25px;
            text-align: center;
            font-size: 24px;
            color: #bf55ff; /* Sonuç için açık mor/pembe tonu */
            font-weight: bold;
            display: none;
            padding: 15px;
            border-top: 1px solid #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>USED CAR PRICE ESTIMATE</h1>
        <form id="predictionForm" class="form-grid">
            <div>
                <label>Present Price (Lakh)</label>
                <input type="number" name="Present_Price" step="0.01" required>
            </div>
            <div>
                <label>Kilometers Driven</label>
                <input type="number" name="Kms_Driven" required>
            </div>
            <div>
                <label>Fuel Type</label>
                <select name="Fuel_Type">
                    <option value="Petrol">Petrol</option>
                    <option value="Diesel">Diesel</option>
                    <option value="CNG">CNG</option>
                </select>
            </div>
            <div>
                <label>Seller Type</label>
                <select name="Seller_Type">
                    <option value="Dealer">Dealer</option>
                    <option value="Individual">Individual</option>
                </select>
            </div>
            <div>
                <label>Transmission</label>
                <select name="Transmission">
                    <option value="Manual">Manual</option>
                    <option value="Automatic">Automatic</option>
                </select>
            </div>
            <div>
                <label>Owner</label>
                <input type="number" name="Owner" min="0" max="3" value="0">
            </div>
            <div class="full-width">
                <label>Vehicle Age (Years)</label>
                <input type="number" name="Vehicle_Age" required>
            </div>
            <button type="submit">GUESS THE PRICE</button>
        </form>
        <div id="result"></div>
    </div>

    <script>
        document.getElementById('predictionForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());

            // Veri tiplerini API'ya uygun hale getiriyoruz
            data.Present_Price = parseFloat(data.Present_Price);
            data.Kms_Driven = parseInt(data.Kms_Driven);
            data.Owner = parseInt(data.Owner);
            data.Vehicle_Age = parseInt(data.Vehicle_Age);

            const response = await fetch('/predict', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            const result = await response.json();
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = "Estimated Price: " + result.predicted_price;
        });
    </script>
</body>
</html>
